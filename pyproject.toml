[project]
name = "llm-jp-factcheck"
version = "0.1.0"
description = "Chat with an LLM and check its claims using evidence retrieved from its training data."
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "elasticsearch==8.13.0",
    "openai>=2,<3",
    "python-dotenv==1.0.1",
    "streamlit==1.48.0",
    "transformers==4.40.1",
]

[dependency-groups]
dev = [
    "pre-commit>=4.0,<5",
    "ruff==0.16.7",
]
evaluation = [
    "mecab-python3>=1.0.10,<2",
    "numpy>=1.26,<3",
    "scipy>=1.14,<2",
    "unidic-lite==1.0.8",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
indent-width = 4
target-version = "py310"

[tool.ruff.lint]
select = [
    # Pyflakes
    "F",
    # isort
    "I001"
]
